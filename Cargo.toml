[workspace]
members = ["crates/domain", "crates/storage", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.0.14"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["json", "ws"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "fs", "io-util"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
